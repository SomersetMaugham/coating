name: CI

# Manual only (Actions tab -> CI -> Run workflow). The repository is private, so every run is billed against
# the Actions minutes, with macOS counted 10x and Windows 2x; automatic runs on every push and PR used them up.
# Before merging, run the suite locally on Python 3.10 and 3.13 instead (see AGENTS.md, "Commands").
on:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # A normal run takes 1-2 minutes. Without a limit, a stuck step waits for GitHub's 6-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        # apt on hosted runners has stalled for 10+ minutes several times. Bound every attempt and
        # retry, so a bad mirror costs minutes instead of hours.
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get $APT update &&
               timeout 120 sudo apt-get $APT install -y \
                 libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying in 10 s" >&2
            sleep 10
          done
          exit 1
      - name: Korean font (Linux, optional)
        if: runner.os == 'Linux'
        # The stalls were all in downloading fonts-noto-cjk (61 MB). NanumGothic (~10 MB) is also in
        # gui/fonts.py's candidate list. The tests pass without any CJK font (matplotlib only warns
        # about missing glyphs), so a slow mirror here must not fail the job.
        continue-on-error: true
        timeout-minutes: 4
        env:
          DEBIAN_FRONTEND: noninteractive
        run: timeout 180 sudo apt-get -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=60 install -y fonts-nanum
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Test
        run: python -m pytest -n auto -v
